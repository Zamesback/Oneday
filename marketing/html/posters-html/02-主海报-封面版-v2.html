<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OneDay 主海报 - 封面版</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Noto+Serif+SC:wght@400;700;900&display=swap');
  
  * { margin: 0; padding: 0; box-sizing: border-box; }
  
  body {
    width: 1200px;
    height: 1600px;
    background: #FAFAFA;
    font-family: 'Space Mono', 'SF Mono', monospace;
    color: #000;
    position: relative;
    overflow: hidden;
  }
  
  /* 电子网格背景 */
  body::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0; bottom: 0;
    background-image: 
      linear-gradient(rgba(0,0,0,0.03) 1px, transparent 1px),
      linear-gradient(90deg, rgba(0,0,0,0.03) 1px, transparent 1px);
    background-size: 24px 24px;
    pointer-events: none;
  }
  
  /* 顶部红色条 */
  .top-bar {
    position: absolute;
    top: 0; left: 0;
    width: 200px; height: 6px;
    background: #FF3B30;
  }
  
  /* 角落装饰 */
  .corner {
    position: absolute;
    width: 24px; height: 24px;
    border: 2px solid #000;
  }
  .corner-tl { top: 40px; left: 60px; border-right: none; border-bottom: none; }
  .corner-tr { top: 40px; right: 60px; border-left: none; border-bottom: none; }
  .corner-bl { bottom: 40px; left: 60px; border-right: none; border-top: none; }
  .corner-br { bottom: 40px; right: 60px; border-left: none; border-top: none; }
  
  .container {
    padding: 80px 100px;
    position: relative;
    z-index: 1;
    height: 100%;
    display: flex;
    flex-direction: column;
  }
  
  /* 头部 */
  .header {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    margin-bottom: 40px;
  }
  
  .logo {
    display: flex;
    align-items: baseline;
    gap: 16px;
  }
  
  .logo-cn {
    font-family: 'Noto Serif SC', serif;
    font-size: 32px;
    font-weight: 900;
    letter-spacing: 6px;
  }
  
  .logo-en {
    font-size: 14px;
    letter-spacing: 3px;
    color: #666;
  }
  
  .logo-dot {
    display: inline-block;
    width: 6px; height: 6px;
    background: #FF3B30;
    margin-left: 4px;
    animation: blink 1.2s infinite;
  }
  
  @keyframes blink {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.2; }
  }
  
  .tagline {
    font-size: 11px;
    letter-spacing: 3px;
    color: #999;
    text-align: right;
    line-height: 1.8;
  }
  
  /* 中央大字 */
  .center {
    flex: 1;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    position: relative;
  }
  
  .big-char {
    font-family: 'Noto Serif SC', serif;
    font-size: 420px;
    font-weight: 900;
    line-height: 1;
    letter-spacing: 20px;
    position: relative;
    display: flex;
    align-items: center;
  }
  
  .char-yi {
    color: #FF3B30;
    position: relative;
  }
  
  .char-yi::before {
    content: '';
    position: absolute;
    top: 50%;
    left: -40px;
    width: 120px;
    height: 8px;
    background: #FF3B30;
    transform: translateY(-50%);
  }
  
  .char-ri {
    color: #000;
    position: relative;
  }
  
  .char-ri::after {
    content: '';
    position: absolute;
    bottom: 20px;
    right: -20px;
    width: 20px;
    height: 20px;
    background: #FF3B30;
    border-radius: 50%;
    animation: pulse 2s infinite;
  }
  
  @keyframes pulse {
    0%, 100% { transform: scale(1); opacity: 1; }
    50% { transform: scale(1.3); opacity: 0.6; }
  }
  
  /* 英文 */
  .english {
    font-size: 36px;
    letter-spacing: 12px;
    margin-top: 40px;
    color: #000;
    font-weight: 700;
  }
  
  .english .red {
    color: #FF3B30;
  }
  
  /* Slogan */
  .slogan {
    font-family: 'Noto Serif SC', serif;
    font-size: 24px;
    color: #666;
    margin-top: 30px;
    letter-spacing: 4px;
  }
  
  /* 电路线条装饰 */
  .circuit {
    position: absolute;
    bottom: 280px;
    left: 100px;
    right: 100px;
    height: 60px;
    pointer-events: none;
    opacity: 0.4;
  }
  
  .circuit-line {
    position: absolute;
    background: #000;
  }
  
  .circuit-dot {
    position: absolute;
    width: 8px; height: 8px;
    background: #FF3B30;
    border-radius: 50%;
  }
  
  /* 底部特性 */
  .features {
    display: flex;
    justify-content: center;
    gap: 60px;
    padding-top: 40px;
    border-top: 2px solid #000;
    margin-top: 40px;
  }
  
  .feature {
    display: flex;
    align-items: center;
    gap: 12px;
    font-size: 14px;
    letter-spacing: 2px;
    color: #333;
  }
  
  .feature-dot {
    width: 6px; height: 6px;
    background: #FF3B30;
  }
  
  /* 底部 */
  .footer {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-top: 30px;
    padding-top: 20px;
    border-top: 1px solid rgba(0,0,0,0.1);
  }
  
  .footer-left {
    font-size: 11px;
    color: #999;
    letter-spacing: 2px;
  }
  
  .footer-right {
    font-size: 11px;
    color: #999;
    letter-spacing: 3px;
  }
  
  /* 侧边竖排文字 */
  .side-text {
    position: absolute;
    top: 50%;
    transform: translateY(-50%) rotate(-90deg);
    font-size: 10px;
    letter-spacing: 4px;
    color: #ccc;
    white-space: nowrap;
  }
  
  .side-left { left: 20px; }
  .side-right { right: 20px; }
</style>
</head>
<body>
  <div class="top-bar"></div>
  <div class="corner corner-tl"></div>
  <div class="corner corner-tr"></div>
  <div class="corner corner-bl"></div>
  <div class="corner corner-br"></div>
  
  <div class="side-text side-left">// 2026 · SHANGHAI</div>
  <div class="side-text side-right">// EVERY DAY · ONE CARD</div>
  
  <div class="container">
    <div class="header">
      <div class="logo">
        <span class="logo-cn">一日</span>
        <span class="logo-en">ONE DAY<span class="logo-dot"></span></span>
      </div>
      <div class="tagline">
        NOT A CALENDAR<br>
        AN INTERFACE FOR YOUR LIFE
      </div>
    </div>
    
    <div class="center">
      <div class="big-char">
        <span class="char-yi">一</span>
        <span class="char-ri">日</span>
      </div>
      <div class="english">O<span class="red">n</span>eDay</div>
      <div class="slogan">把每一天，活成一张卡片</div>
    </div>
    
    <!-- 电路装饰 -->
    <div class="circuit">
      <div class="circuit-line" style="top: 10px; left: 0; width: 200px; height: 1px;"></div>
      <div class="circuit-line" style="top: 10px; left: 200px; width: 1px; height: 30px;"></div>
      <div class="circuit-line" style="top: 40px; left: 200px; width: 300px; height: 1px;"></div>
      <div class="circuit-dot" style="top: 36px; left: 196px;"></div>
      <div class="circuit-line" style="top: 10px; right: 0; width: 250px; height: 1px;"></div>
      <div class="circuit-line" style="top: 10px; right: 250px; width: 1px; height: 40px;"></div>
      <div class="circuit-line" style="top: 50px; right: 250px; width: 200px; height: 1px;"></div>
      <div class="circuit-dot" style="top: 46px; right: 246px;"></div>
    </div>
    
    <div class="features">
      <div class="feature"><span class="feature-dot"></span>闲聊输入</div>
      <div class="feature"><span class="feature-dot"></span>每日开屏</div>
      <div class="feature"><span class="feature-dot"></span>OneDay 卡片</div>
      <div class="feature"><span class="feature-dot"></span>生活伙伴</div>
    </div>
    
    <div class="footer">
      <div class="footer-left">© 2026 ONEDAY · ALL RIGHTS RESERVED</div>
      <div class="footer-right">EXPERIENCE EVERY DAY</div>
    </div>
  </div>
</body>
</html>
